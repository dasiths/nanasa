version: 2
repository:
  path: .
  checkout: { kind: current }
integrations:
  copilot:
    name: GitHub Copilot from environment
    kind: copilot
    providerState: { scope: integration }
    credentials:
      kind: broker-profile
      profileId: copilot-from-environment
  claude-code:
    name: Claude Code from helper
    kind: claude-code
    providerState: { scope: membership }
    credentials:
      kind: broker-profile
      profileId: claude-from-helper
groups:
  credential-example:
    name: Credential profile example
    agents:
      agent_reviewer:
        memberId: claude.reviewer
        name: Reviewer
        integrationId: claude-code