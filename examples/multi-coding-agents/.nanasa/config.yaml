          completion: true
          delivery-failure: true
          provider-update-failed: true
        order: 0
      frontend-reviewer:
        memberId: frontend-reviewer
        name: Frontend Reviewer
        integrationId: opencode
        roleId: reviewer
        instructions: []
        order: 1
messages:
  retentionPerGroup: 1000
