        roleId: implementor
        instructions: []
        order: 1
      agent_e0f1b592-5fb2-4fe2-93e4-ac9da40dedf1:
        memberId: musing-kilby
        name: Engineer 2
        integrationId: claude-copilot
        roleId: implementor
        instructions: []
        order: 2
      agent_9e2cdefb-cc96-4b4e-865f-b4ac17f6c4f9:
        memberId: vibrant-mirzakhani
        name: Reviewer
        integrationId: opencode
        roleId: reviewer
        instructions: []
