name: Release verification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  exact-commit-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Pin reproducible build time
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -a
          if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi
          set +a
          corepack enable
          set -a; if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi; set +a; pnpm install --frozen-lockfile
      - name: Verify exact candidate
        shell: bash
        run: |
          set -a
          if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi
          set +a
          pnpm check:static
          set -a; if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi; set +a; pnpm test
          set -a; if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi; set +a; pnpm acceptance
          set -a; if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi; set +a; pnpm docs:check
          set -a; if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi; set +a; pnpm release:dry-run
      - name: Pack immutable candidate
        shell: bash
        run: |
          mkdir -p release-artifacts
          set -a
          if [[ -f .devcontainer/.env ]]; then source .devcontainer/.env; else source .devcontainer/.env.example; fi
          set +a
          pnpm pack --pack-destination release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nanasa-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            dist/meta/build.json
            dist/meta/sbom.spdx.json

  publication-boundary:
    needs: exact-commit-release
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Verification produces immutable artifacts; trusted npm publication remains environment-owned."
