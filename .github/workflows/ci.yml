name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NANASA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NANASA_ALLOW_PUBLIC_REGISTRY_FALLBACK: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NANASA_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$NANASA_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure registry and pinned pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: |
          source scripts/ci-registry-env.sh
          pnpm install --frozen-lockfile
      - name: Check source and documentation
        run: |
          source scripts/ci-registry-env.sh; pnpm check:static
          source scripts/ci-registry-env.sh; pnpm docs:check

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NANASA_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$NANASA_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure registry and pinned pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: |
          source scripts/ci-registry-env.sh
          pnpm install --frozen-lockfile
      - name: Run unit, release, migration, and coverage tests
        run: |
          source scripts/ci-registry-env.sh; pnpm test:unit
          source scripts/ci-registry-env.sh; pnpm test:release
          source scripts/ci-registry-env.sh; pnpm check:migration
          source scripts/ci-registry-env.sh; pnpm test:coverage

  terminal-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NANASA_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$NANASA_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure registry and pinned pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install runtime and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          source scripts/ci-registry-env.sh; pnpm install --frozen-lockfile
          source scripts/ci-registry-env.sh; pnpm exec playwright install --with-deps chromium
      - name: Run credential-free terminal tests
        env:
          NANASA_BROWSER: chromium
        run: |
          source scripts/ci-registry-env.sh; pnpm smoke
          source scripts/ci-registry-env.sh; pnpm check:systemd
          source scripts/ci-registry-env.sh; pnpm check:watchdog
          source scripts/ci-registry-env.sh; pnpm acceptance:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-e2e-${{ env.NANASA_CANDIDATE_SHA }}
          path: |
            test-results/
            playwright-report/

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NANASA_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$NANASA_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure registry and pinned pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: |
          source scripts/ci-registry-env.sh
          pnpm install --frozen-lockfile
      - name: Build and verify the package
        run: |
          source scripts/ci-registry-env.sh; pnpm package:test
          source scripts/ci-registry-env.sh; pnpm release:dry-run

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NANASA_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$NANASA_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure registry and pinned pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: |
          source scripts/ci-registry-env.sh
          pnpm install --frozen-lockfile
      - name: Check source and package security
        run: |
          source scripts/ci-registry-env.sh; pnpm package:build
          source scripts/ci-registry-env.sh; pnpm check:security

  required:
    if: always()
    needs: [quality, unit, terminal-e2e, package, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.terminal-e2e.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.security.result }}" = success