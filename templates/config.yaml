version: 2
repository:
  path: .
  checkout: { kind: current }
terminal:
  checkpoints:
    enabled: false
    maxLines: 5000
    maxBytes: 1048576
    retentionSeconds: 86400
    sensitivity: repository-private
instructions: []
attention:
  defaults:
    response-required: true
    agent-health: true
    completion: true
    delivery-failure: true
    action-state: false
    provider-update-failed: true
    provider-update-succeeded: false
    unread-message: false
integrations:
  copilot:
    name: GitHub Copilot
    kind: copilot
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-session }
    nativeRecovery: { mode: resume-or-restart, confirmationTimeoutSeconds: 30 }
  pi:
    name: Pi
    kind: pi
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-session }
    nativeRecovery: { mode: resume-or-restart, confirmationTimeoutSeconds: 30 }
  opencode:
    name: OpenCode
    kind: opencode
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-session }
    nativeRecovery: { mode: resume-or-restart, confirmationTimeoutSeconds: 30 }
  claude-code:
    name: Claude Code
    kind: claude-code
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-session }
    nativeRecovery: { mode: resume-or-restart, confirmationTimeoutSeconds: 30 }
extensions: {}
roles:
  project-manager:
    name: Project Manager
    description: Coordinates assignments, dependencies, decisions, and completion
    presentation:
      icon: clipboard-list
      color: teal
    permissionPolicy: inherit
  implementor:
    name: Implementor
    description: Implements assigned changes and validates the result
    presentation:
      icon: hammer
      color: blue
    permissionPolicy: inherit
  reviewer:
    name: Reviewer
    description: Reviews changes and reports prioritized findings without modifying files
    presentation:
      icon: shield-check
      color: amber
    permissionPolicy: read-only
groups: {}
messages:
  retentionPerGroup: 1000