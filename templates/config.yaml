version: 2
repository:
  path: .
  checkout: { kind: current }
terminal:
  checkpoints:
    enabled: false
    maxLines: 5000
    maxBytes: 1048576
    retentionSeconds: 86400
    sensitivity: repository-private
instructions: []
integrations:
  copilot:
    name: GitHub Copilot
    kind: copilot
    command: [copilot]
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-native }
    nativeRecovery: resume-or-restart
  pi:
    name: Pi
    kind: pi
    command: [pi]
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-native }
    nativeRecovery: resume-or-restart
  opencode:
    name: OpenCode
    kind: opencode
    command: [opencode]
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-native }
    nativeRecovery: resume-or-restart
  claude-code:
    name: Claude Code
    kind: claude-code
    command: [claude]
    cwd: .
    providerState: { scope: membership }
    credentials: { kind: provider-managed }
    model: { resumePolicy: preserve-native }
    nativeRecovery: resume-or-restart
extensions: {}
roles:
  project-manager:
    name: Project Manager
    description: Coordinates assignments, dependencies, decisions, and completion
    presentation:
      icon: clipboard-list
      color: teal
    permissionPolicy: inherit
  implementor:
    name: Implementor
    description: Implements assigned changes and validates the result
    presentation:
      icon: hammer
      color: blue
    permissionPolicy: inherit
  reviewer:
    name: Reviewer
    description: Reviews changes and reports prioritized findings without modifying files
    presentation:
      icon: shield-check
      color: amber
    permissionPolicy: read-only
groups: {}
messages:
  retentionPerGroup: 1000