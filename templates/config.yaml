instructions: []
integrations:
  copilot:
    name: GitHub Copilot
    kind: copilot
    command: [copilot]
    cwd: .
    agentConfigHome: { scope: integration }
  pi:
    name: Pi
    kind: pi
    command: [pi]
    cwd: .
    agentConfigHome: { scope: integration }
  opencode:
    name: OpenCode
    kind: opencode
    command: [opencode]
    cwd: .
    agentConfigHome: { scope: integration }
  claude-code:
    name: Claude Code
    kind: claude-code
    command: [claude]
    cwd: .
    agentConfigHome: { scope: integration }
roles:
  project-manager:
    name: Project Manager
    description: Coordinates assignments, dependencies, decisions, and completion
    presentation:
      icon: clipboard-list
      color: teal
    permissionPolicy: inherit
  implementor:
    name: Implementor
    description: Implements assigned changes and validates the result
    presentation:
      icon: hammer
      color: blue
    permissionPolicy: inherit
  reviewer:
    name: Reviewer
    description: Reviews changes and reports prioritized findings without modifying files
    presentation:
      icon: shield-check
      color: amber
    permissionPolicy: read-only
groups: {}
messages:
  retentionPerGroup: 1000