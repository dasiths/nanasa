version: 1
instructions: []
roles:
  project-manager:
    name: Project Manager
    description: Coordinates assignments, dependencies, decisions, and completion
    permissionPolicy: inherit
  implementor:
    name: Implementor
    description: Implements assigned changes and validates the result
    permissionPolicy: inherit
  reviewer:
    name: Reviewer
    description: Reviews changes and reports prioritized findings without modifying files
    permissionPolicy: read-only
agentTypes:
  copilot:
    name: GitHub Copilot
    kind: copilot
    command: [copilot]
    cwd: .
    agentConfigHome: { scope: agent-type }
  pi:
    name: Pi
    kind: pi
    command: [pi]
    cwd: .
    agentConfigHome: { scope: agent-type }
  opencode:
    name: OpenCode
    kind: opencode
    command: [opencode]
    cwd: .
    agentConfigHome: { scope: agent-type }
  claude-code:
    name: Claude Code
    kind: claude-code
    command: [claude]
    cwd: .
    agentConfigHome: { scope: agent-type }
agentProfiles: {}
groups: {}
messages:
  retentionPerGroup: 1000