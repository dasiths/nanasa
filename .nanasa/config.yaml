version: 1
instructions:
  - .nanasa/instructions/nanasa-mcp.md
  - .nanasa/instructions/team.md
roles:
  project-manager:
    name: Project Manager
    description: Coordinates assignments, dependencies, decisions, and completion
    instructions:
      - .nanasa/instructions/project-manager.md
    permissionPolicy: inherit
    presentation:
      icon: clipboard-list
      color: teal
  implementor:
    name: Implementor
    description: Implements assigned changes and validates the result
    instructions:
      - .nanasa/instructions/implementor.md
    permissionPolicy: inherit
    presentation:
      icon: hammer
      color: blue
  reviewer:
    name: Reviewer
    description: Reviews changes and reports prioritized findings without modifying files
    instructions:
      - .nanasa/instructions/reviewer.md
    permissionPolicy: read-only
    presentation:
      icon: shield-check
      color: amber
agentTypes:
  copilot:
    name: GitHub Copilot
    kind: copilot
    command: [ copilot ]
    cwd: .
    agentConfigHome: { scope: agent-type }
  pi:
    name: Pi
    kind: pi
    command: [ pi ]
    cwd: .
    agentConfigHome: { scope: agent-type }
  opencode:
    name: OpenCode
    kind: opencode
    command: [ opencode ]
    cwd: .
    agentConfigHome: { scope: agent-type }
  claude-code:
    name: Claude Code
    kind: claude-code
    command: [ claude ]
    cwd: .
    agentConfigHome: { scope: agent-type }
  claude-copilot:
    name: Claude Code via Copilot
    kind: claude-code
    command: [ make, claude-copilot ]
    cwd: .
    agentConfigHome: { scope: agent-type }
