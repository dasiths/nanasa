version: 1
agentTypes:
  copilot:
    name: GitHub Copilot
    kind: copilot
    command: [copilot]
    cwd: .
  pi:
    name: Pi
    kind: pi
    command: [pi]
    cwd: .
  opencode:
    name: OpenCode
    kind: opencode
    command: [opencode]
    cwd: .
  claude-code:
    name: Claude Code
    kind: claude-code
    command: [claude]
    cwd: .
  claude-copilot:
    name: Claude Code via Copilot
    kind: claude-code
    command: [make, claude-copilot]
    cwd: .