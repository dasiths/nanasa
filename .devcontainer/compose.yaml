services:
  nanasa:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmjs.org/}
    volumes:
      - ..:/workspaces/nanasa:cached
    command: sleep infinity

  litellm:
    build:
      context: ..
      dockerfile: .devcontainer/litellm.Dockerfile
    environment:
      GITHUB_COPILOT_TOKEN_DIR: /root/.config/litellm/github_copilot
    volumes:
      - litellm-copilot-auth:/root/.config/litellm/github_copilot
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://localhost:4000/health/liveliness', headers={'Authorization': 'Bearer sk-local-litellm'}); urllib.request.urlopen(request)"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  litellm-copilot-auth: